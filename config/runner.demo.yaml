mode: demo
profile: okx-demo
liveTradingEnabled: false
executeDemoByDefault: false
requireHumanApproval: true

allowedInstruments:
  - BTC-USDT
  - ETH-USDT

blockedInstrumentTypes:
  - SWAP
  - FUTURES
  - OPTION

allowedOrderTypes:
  - limit
  - post_only

signalProcessing:
  recordAllSignals: true
  maxDisplayedSignalsPerStrategy: 5
  maxDisplayedSignalsPerInstrument: 5
  maxDryRunProposalsPerRun: 3
  maxExecutableOrdersPerRun: 0

reporting:
  includeNoSignalStrategies: true
  groupByStrategy: true
  groupByInstrument: true
  groupByTimeframe: true
  showBlockedReasons: true
