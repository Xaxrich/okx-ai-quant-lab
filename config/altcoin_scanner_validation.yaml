data_sources:
  primary:
    name: CoinGecko
    tier: free
    available_fields:
      - price
      - market_cap
      - total_volume
      - circulating_supply
    limitations:
      - daily granularity only
      - no intraday data
      - market_cap methodology can change

  unavailable:
    - name: DexScreener
      reason: HTTP 403 — automated access blocked
    - name: Etherscan
      reason: HTTP 403 — automated access blocked
    - name: BscScan
      reason: HTTP 403 — automated access blocked
    - name: Social APIs
      reason: Not configured — no API keys
    - name: Multi-exchange OHLCV
      reason: Not configured — no exchange API keys

validation_config:
  min_data_days: 30
  max_lookback_days: 365
  forward_window_days: 7
  min_positive_events: 3
  min_control_samples: 5
